name: React Doctor

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'react-app/**'

jobs:
  react-doctor:
    name: React Health Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run React Doctor
        run: npx -y react-doctor@latest . --json --fail-on warning
